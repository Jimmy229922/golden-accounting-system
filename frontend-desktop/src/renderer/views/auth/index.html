<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="auth.css">
    <script src="../../assets/js/theme.js"></script>
</head>
<body  dir="rtl">
    <div class="auth-card">
        <h1 id="titleText" data-i18n="auth.loginTitle">تسجيل الدخول</h1>
        <p id="subtitleText" data-i18n="auth.loginSubtitle">ادخل اسم المستخدم وكلمة المرور للمتابعة.</p>
        <form id="authForm">
            <div class="form-group">
                <label for="username" data-i18n="auth.username">اسم المستخدم</label>
                <input id="username" type="text" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password" data-i18n="auth.password">كلمة المرور</label>
                <div class="password-field-wrapper">
                    <input id="password" type="password" autocomplete="current-password" required>
                    <button type="button" class="password-toggle-btn" id="passwordToggleBtn" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور" aria-pressed="false">
                        <span class="password-toggle-icon" aria-hidden="true">🐵</span>
                    </button>
                </div>
            </div>
            <div class="form-group" id="confirmGroup" hidden>
                <label for="confirmPassword" data-i18n="auth.confirmPassword">تأكيد كلمة المرور</label>
                <input id="confirmPassword" type="password" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary" id="submitBtn" data-i18n="auth.loginBtn">دخول</button>
            <div class="forgot-password-link" style="text-align: center; margin-top: 15px;">
                <a href="#" id="forgotPasswordBtn" style="color: #64748b; font-size: 13px; text-decoration: none;">هل نسيت كلمة المرور؟</a>
            </div>
            <div id="status" class="status"></div>
        </form>
    </div>
    <div id="recoveryModal" class="recovery-modal-overlay" style="display: none;">
        <div class="recovery-modal-card">
            <div class="recovery-modal-header">
                <h2>استرداد وتعيين كلمة المرور</h2>
                <button type="button" class="recovery-modal-close" id="closeRecoveryIconBtn" title="إغلاق">&times;</button>
            </div>
            <p class="recovery-modal-desc">أرسل رمز الاسترداد التالي للدعم الفني للحصول على كود فك القفل المؤقت لليوم:</p>
            <div class="recovery-challenge-wrapper">
                <div class="recovery-challenge-box" id="recoveryChallengeText" title="انقر للنسخ">جاري التحميل...</div>
                <button type="button" class="recovery-copy-btn" id="copyChallengeBtn" title="نسخ الرمز">📋 نسخ</button>
            </div>
            <div class="form-group">
                <label for="recoveryCodeInput">كود فك القفل المستلم:</label>
                <div class="recovery-input-group">
                    <input type="text" id="recoveryCodeInput" placeholder="XXXX-XXXX" autocomplete="off" spellcheck="false">
                    <button type="button" class="btn-verify" id="verifyRecoveryCodeBtn">تحقق</button>
                </div>
            </div>
            <div class="form-group recovery-password-group locked" id="recoveryPasswordGroup">
                <label for="recoveryNewPasswordInput">كلمة المرور الجديدة:</label>
                <input type="password" id="recoveryNewPasswordInput" placeholder="يجب التحقق من كود فك القفل أولاً" autocomplete="new-password" disabled>
            </div>
            <div id="recoveryStatus" class="status"></div>
            <div class="recovery-modal-actions">
                <button type="button" class="btn-secondary" id="closeRecoveryBtn">إلغاء</button>
                <button type="button" class="btn-primary" id="submitRecoveryBtn" disabled>حفظ وتعيين</button>
            </div>
        </div>
    </div>
    <script src="../../assets/js/i18n.js"></script>
    <script src="auth.state.js"></script>
    <script src="auth.api.js"></script>
    <script src="auth.ui.js"></script>
    <script src="auth.js"></script>
</body>
</html>
